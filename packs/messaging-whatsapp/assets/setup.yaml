provider_id: whatsapp
version: 1
title: WhatsApp provider setup
questions:
  - name: phone_number_id
    title: Phone number ID
    kind: string
    required: true
    help: "WhatsApp Business phone number ID from Meta Developer Portal"
    group: Connection
    docs_url: "https://developers.facebook.com/docs/whatsapp/cloud-api/get-started"
    create_url: "https://developers.facebook.com/apps/create/"
  - name: public_base_url
    title: Public base URL
    kind: string
    required: true
    help: "Public-facing URL for webhook callbacks. Use the runtime or tunnel URL shown by the setup host."
    group: Connection
    validate:
      regex: "^https://"
  - name: business_account_id
    title: Business account ID
    kind: string
    required: true
    help: "WhatsApp Business Account ID from Meta Developer Portal"
    group: Connection
    docs_url: "https://developers.facebook.com/docs/whatsapp/cloud-api/get-started"
    create_url: "https://developers.facebook.com/apps/create/"
  - name: api_base_url
    title: API base URL
    kind: string
    required: true
    default: "https://graph.facebook.com"
    help: "WhatsApp Cloud API base URL (default: https://graph.facebook.com)"
    placeholder: "https://graph.facebook.com"
    group: Connection
    validate:
      regex: "^https?://"
  - name: api_version
    title: API version
    kind: string
    required: true
    default: "v17.0"
    help: "WhatsApp Cloud API version"
    placeholder: "v17.0"
    group: Connection
  - name: whatsapp_token
    title: WhatsApp access token
    kind: string
    required: true
    secret: true
    help: "Permanent access token from Meta Developer Portal"
    group: Authentication
    docs_url: "https://developers.facebook.com/docs/whatsapp/cloud-api/get-started"
    create_url: "https://developers.facebook.com/apps/create/"
  - name: whatsapp_verify_token
    title: WhatsApp verify token
    kind: string
    required: true
    secret: true
    help: "Custom token for webhook verification (you choose this value)"
    group: Authentication
  - name: whatsapp_app_secret
    title: WhatsApp app secret
    kind: string
    required: false
    secret: true
    help: "App secret from Meta App Dashboard (App settings → Basic). Used to verify that webhook calls come from Meta. Without it, files sent on WhatsApp are not read."
    group: Authentication
    docs_url: "https://developers.facebook.com/docs/graph-api/webhooks/getting-started#event-notifications"

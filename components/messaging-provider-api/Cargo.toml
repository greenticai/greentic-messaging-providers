[package]
name = "messaging-provider-api"
edition.workspace = true
version = "0.5.0"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
api-channel-core = { path = "../../crates/api-channel-core" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
greentic-types.workspace = true
wit-bindgen.workspace = true
base64.workspace = true
chrono.workspace = true
uuid = { workspace = true, features = ["v4"] }
provider-common.workspace = true

[package.metadata.component]
package = "greentic:messaging-provider-api-core"

[package.metadata.component.target]
path = "wit/messaging-provider-api"
world = "component-v0-v6-v0"

[package.metadata.component.target.dependencies]
"greentic:http" = { path = "wit/messaging-provider-api/deps/http" }
"greentic:state" = { path = "wit/messaging-provider-api/deps/state" }
"greentic:interfaces-types" = { path = "wit/messaging-provider-api/deps/interfaces-types" }
"greentic:secrets-store" = { path = "wit/messaging-provider-api/deps/secrets-store" }
"greentic:provider-schema-core" = { path = "wit/messaging-provider-api/deps/provider-schema-core" }
"provider:common" = { path = "wit/messaging-provider-api/deps/provider-common" }

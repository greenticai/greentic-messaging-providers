[package]
name = "messaging-provider-teams-graph"
edition.workspace = true
version = "0.5.26"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
greentic-telemetry = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
greentic-types.workspace = true
wit-bindgen.workspace = true
urlencoding.workspace = true
base64.workspace = true
chrono.workspace = true
provider-common.workspace = true

[package.metadata.component]
package = "greentic:messaging-provider-teams-graph-core"

[package.metadata.component.target]
path = "wit/messaging-provider-teams-graph"
world = "component-v0-v6-v0"

[package.metadata.component.target.dependencies]
"greentic:http" = { path = "wit/messaging-provider-teams-graph/deps/http" }
"greentic:secrets-store" = { path = "wit/messaging-provider-teams-graph/deps/secrets-store" }
"greentic:interfaces-types" = { path = "wit/messaging-provider-teams-graph/deps/interfaces-types" }
"greentic:provider-schema-core" = { path = "wit/messaging-provider-teams-graph/deps/provider-schema-core" }
